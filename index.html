<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" data-i18n="meta.description">
  <title data-i18n="meta.title">Tender Package Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
</head>
<body>
  <header class="topbar" role="banner">
    <div class="topbar__brand">
      <span class="topbar__title" data-i18n="nav.topbar">Tender Package Builder</span>
    </div>
    <nav class="topbar__nav" aria-label="Language selection">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button
          class="lang-toggle__btn"
          data-lang="bn"
          aria-pressed="false"
          data-i18n="toggle.bn">বাংলা
        </button>
        <button
          class="lang-toggle__btn"
          data-lang="en"
          aria-pressed="true"
          data-i18n="toggle.en">EN
        </button>
      </div>
    </nav>
  </header>

  <main class="main" role="main">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title" data-i18n="hero.title">Tender Package Builder</h1>
      <p data-i18n="hero.subtitle">Build complete tender document packages with ease</p>
      <nav aria-label="Primary navigation">
        <a href="#" class="btn btn--primary" data-i18n="nav.home">Get Started</a>
      </nav>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <p data-i18n="footer.copyright">© 2024 Tender Package Builder</p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
