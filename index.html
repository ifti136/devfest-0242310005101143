<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender Package Builder</title>
  <meta name="description" content="Match, check, and build your tender document package">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233b3b4f'/%3E%3Cpath d='M9 8h10l4 4v12H9z' fill='%23f7f4ee'/%3E%3Cpath d='M19 8v4h4' fill='%23d9d3c7'/%3E%3C/svg%3E">
  <script>
    // Guard: ES modules don't work on file:// — show helpful message
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var div = document.createElement('div');
        div.style.cssText = 'max-width:32rem;margin:4rem auto;padding:1.5rem;border:1px solid #c94f4f;border-radius:8px;font-family:system-ui,sans-serif;background:#fdf3f3;color:#3a2020;line-height:1.6';
        div.textContent = 'This page must be opened through a web server (e.g. GitHub Pages or a local HTTP server), not directly as a file. Please serve the folder over HTTP and reload.';
        document.body.prepend(div);
      });
    }
    // Theme no-flash: apply saved theme before first paint
    (function(){
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
      } catch(e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>

  <!-- Header band (keeps .top-bar for E2E selectors) -->
  <header class="app-header top-bar">
    <div class="header-inner">
      <span class="brand">
        <svg class="brand-emblem" aria-hidden="true" viewBox="0 0 32 32" width="32" height="32">
          <defs>
            <linearGradient id="emblem-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4a5ab5"/>
              <stop offset="100%" stop-color="#7c88d6"/>
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="url(#emblem-gradient)"/>
          <path d="M8 6h16v20H8z" fill="none" stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 6v8" fill="none" stroke="white" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M12 14l3 3 5-5" fill="none" stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-text">
          <span class="logo" data-i18n="nav.topbar">Tender Package Builder</span>
          <span class="tagline" data-i18n="nav.tagline"></span>
        </span>
      </span>
      <div class="header-controls">
        <span class="processing" data-i18n-attr="aria-label:a11y.local_processing">
          <span class="processing-dot" aria-hidden="true"></span>
          <span class="processing-label" data-i18n="header.processing">Local processing</span>
        </span>
        <button class="theme-toggle" type="button" aria-pressed="false" data-i18n-attr="aria-label:theme.switch_dark">
          <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
            <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            <g stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </g>
          </svg>
          <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="lang-toggle" role="group" aria-label="Language selection" data-i18n-attr="aria-label:a11y.lang_toggle">
          <button class="lang-btn en-btn" aria-pressed="false" data-lang="en" type="button">EN</button>
          <button class="lang-btn bn-btn" aria-pressed="true" data-lang="bn" type="button">বাংলা</button>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container">

    <!-- Tender summary strip (letterhead) -->
    <section class="tender-summary" id="tender-summary" aria-live="polite"></section>

    <!-- Trust row: 4 content-sized chips -->
    <ul class="trust-row" data-i18n-attr="aria-label:a11y.trust_row">
      <li class="trust-chip"><svg class="chip-icon" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><rect x="2" y="3" width="20" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><line x1="2" y1="9" x2="22" y2="9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="7" cy="15" r="1.5" fill="currentColor"/><circle cx="17" cy="15" r="1.5" fill="currentColor"/></svg><span data-i18n="trust.browser">Browser-only processing</span></li>
      <li class="trust-chip"><svg class="chip-icon" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><path d="M12 3v12m0 0l-4-4m4 4l4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="15" x2="16" y2="15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="3.5 3"/></svg><span data-i18n="trust.no_upload">No document uploads</span></li>
      <li class="trust-chip"><svg class="chip-icon" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 14l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="trust.validation">Automatic validation</span></li>
      <li class="trust-chip"><svg class="chip-icon" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="trust.pdf">Submission-ready PDF</span></li>
    </ul>

    <!-- Progress meter -->
    <div class="progress-meter" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-valuetext="0 of 10 ready" aria-label="Package readiness">
      <div class="meter-head">
        <span class="meter-label" data-i18n="progress.label">Package readiness</span>
        <span class="meter-value"><span class="meter-text">0 of 10 ready</span> <svg class="meter-check" hidden aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><polyline points="5 12.5 9 16.5 19 7.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="meter-track"><div class="meter-fill" style="width:0%"></div></div>
    </div>

    <!-- Two-pane workspace -->
    <div class="workspace">

      <!-- Left: requirements checklist -->
      <section class="pane requirements-pane">
        <h2 class="pane-heading" data-i18n="requirements.heading">Requirements</h2>
        <div class="requirements-list" id="requirements-list"></div>
      </section>

      <!-- Right: file tray -->
      <section class="pane file-tray-pane">
        <h2 class="pane-heading" data-i18n="upload.heading">Uploaded files</h2>

        <div class="dropzone" id="dropzone">
          <div id="upload-empty" class="upload-empty">
            <svg class="upload-icon" aria-hidden="true" viewBox="0 0 24 24" width="28" height="28">
              <path d="M12 3v12m0 0l-4-4m4 4l4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3" y="15" width="18" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="upload-drop" data-i18n="upload.drop"></p>
            <p class="upload-or" data-i18n="upload.or"></p>
            <button class="browse-btn" id="browse-btn" type="button" data-i18n="upload.browse"></button>
            <input type="file" id="file-input" class="file-input" accept=".pdf,application/pdf" multiple>
            <p class="upload-limits" id="upload-limits"></p>
          </div>
          <span class="dropzone-add-more">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path d="M12 3v12m0 0l-4-4m4 4l4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3" y="15" width="18" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="upload.add_more"></span>
          </span>
        </div>

        <p class="upload-error" id="upload-error" hidden role="alert"></p>

        <div class="file-list" id="file-list"></div>
      </section>

    </div>
  </main>

  <!-- Sticky status + generate bar -->
  <footer class="status-bar">
    <div class="blocking-bar" id="blocking-bar" hidden aria-live="polite"></div>
    <button class="generate-btn" id="generate-btn" type="button" disabled><svg class="icon-generate" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="15" x2="12" y2="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="btn-label" data-i18n="generate.button">Generate package</span></button>
  </footer>

  <!-- Libraries (allowed per project.md) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
